<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mantenimiento de Clientes</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container-fluid">
        <span class="navbar-brand">🏥 Farmacia Salud — Clientes</span>
        <div class="d-flex gap-2">
            <a href="/ventas"  class="btn btn-outline-light btn-sm"><i class="bi bi-cart3 me-1"></i>Ventas</a>
            <a href="/menu"    class="btn btn-outline-light btn-sm"><i class="bi bi-house me-1"></i>Menú</a>
        </div>
    </div>
</nav>

<main class="container mt-2">
    <h3 class="text-center mb-4">Mantenimiento de Clientes</h3>

    <div th:if="${mensajes != null}" class="alert alert-info text-center" th:text="${mensajes}"></div>

    <form th:action="@{/gestionclientes}" method="get" class="border p-4 rounded mb-4">
        <input type="hidden" name="ClienteID" th:value="${busquedaCliente != null ? busquedaCliente.clientesID : ''}">

        <div class="row mb-3">
            <div class="col-md-4">
                <label>Nro Documento</label>
                <input type="number" name="NumeroDoc" class="form-control"
                       th:value="${busquedaCliente != null ? busquedaCliente.numeroDoc : ''}">
            </div>
            <div class="col-md-4">
                <label>Tipo Documento</label>
                <select name="TipoDocumento" class="form-control">
                    <option value="DNI" th:selected="${busquedaCliente == null || busquedaCliente.tipoDocumento == 'DNI'}">DNI</option>
                    <option value="RUC" th:selected="${busquedaCliente != null && busquedaCliente.tipoDocumento == 'RUC'}">RUC</option>
                    <option value="CE" th:selected="${busquedaCliente != null && busquedaCliente.tipoDocumento == 'CE'}">Carnet de Extranjeria</option>
                </select>
            </div>
            <div class="col-md-4">
                <label>Nombre Completo</label>
                <input type="text" name="NombreCliente" class="form-control"
                       th:value="${busquedaCliente != null ? busquedaCliente.nombreClientes : ''}">
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-md-6">
                <label>Direccion</label>
                <input type="text" name="Direccion" class="form-control"
                       th:value="${busquedaCliente != null ? busquedaCliente.clientesDireccion : ''}">
            </div>
        </div>

        <div class="text-center">
            <button type="submit" name="accion" value="registrar" class="btn btn-success">Registrar</button>
            <button type="submit" name="accion" value="actualizar" class="btn btn-warning">Actualizar</button>
            <button type="submit" name="accion" value="buscar" class="btn btn-info">Buscar</button>
            <a th:href="@{/gestionclientes(accion='listar')}" class="btn btn-secondary">Nuevo</a>
        </div>
    </form>

    <div class="table-responsive">
        <table class="table table-bordered table-hover text-center align-middle">
            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Nro Documento</th>
                <th>Tipo</th>
                <th>Nombre</th>
                <th>Direccion</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="c : ${listarClientes}">
                <td th:text="${c.clientesID}"></td>
                <td th:text="${c.numeroDoc}"></td>
                <td th:text="${c.tipoDocumento}"></td>
                <td th:text="${c.nombreClientes}"></td>
                <td th:text="${c.clientesDireccion}"></td>
                <td>
                    <a th:href="@{/gestionclientes(accion='buscar', NumeroDoc=${c.numeroDoc})}" class="btn btn-sm btn-primary">Editar</a>
                    <a th:href="@{/gestionclientes(accion='eliminar', ClienteID=${c.clientesID})}"
                       class="btn btn-sm btn-danger" onclick="return confirm('Eliminar cliente?')">Eliminar</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="text-center mt-3">
        <a href="/ventas" class="btn btn-primary me-2"><i class="bi bi-cart3 me-1"></i>Ir a Ventas</a>
        <a href="/menu"   class="btn btn-outline-dark"><i class="bi bi-house me-1"></i>Volver al Menú</a>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
