<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mantenimiento de Productos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container-fluid">
        <span class="navbar-brand">🏥 Farmacia Salud — Productos</span>
        <div class="d-flex gap-2">
            <a href="/ventas" class="btn btn-outline-light btn-sm"><i class="bi bi-cart3 me-1"></i>Ventas</a>
            <a href="/menu"   class="btn btn-outline-light btn-sm"><i class="bi bi-house me-1"></i>Menú</a>
        </div>
    </div>
</nav>

<main class="container mt-2">
    <h3 class="text-center mb-4">Mantenimiento de Productos</h3>

    <div th:if="${mensajes != null}" class="alert alert-info text-center" th:text="${mensajes}"></div>

    <form th:action="@{/gestionproductos}" method="get" class="border p-4 rounded mb-4">
        <div class="row mb-3">
            <div class="col-md-4">
                <label>Codigo Producto</label>
                <input type="text" name="Codigo" class="form-control"
                       th:value="${busquedaProducto != null ? busquedaProducto.codigoProductos : ''}">
            </div>
            <div class="col-md-4">
                <label>Descripcion</label>
                <input type="text" name="Descripcion" class="form-control"
                       th:value="${busquedaProducto != null ? busquedaProducto.descripcionProductos : ''}">
            </div>
            <div class="col-md-4">
                <label>Precio Unitario</label>
                <input type="number" step="0.01" name="Precio" class="form-control"
                       th:value="${busquedaProducto != null ? busquedaProducto.preciounitaria : ''}">
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-md-4">
                <label>Laboratorio</label>
                <input type="text" name="Laboratorio" class="form-control"
                       th:value="${busquedaProducto != null ? busquedaProducto.laboratorio : ''}">
            </div>
            <div class="col-md-4">
                <label>Lote</label>
                <input type="text" name="Lote" class="form-control"
                       th:value="${busquedaProducto != null ? busquedaProducto.lote : ''}">
            </div>
            <div class="col-md-4">
                <label>Fecha Vencimiento</label>
                <input type="date" name="FechaVencimiento" class="form-control"
                       th:value="${busquedaProducto != null ? busquedaProducto.fechaVencimiento : ''}">
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-md-4">
                <label>Stock</label>
                <input type="number" name="Stock" class="form-control"
                       th:value="${busquedaProducto != null ? busquedaProducto.stock : ''}">
            </div>
        </div>

        <div class="text-center">
            <button type="submit" name="accion" value="registrar" class="btn btn-success">Registrar</button>
            <button type="submit" name="accion" value="actualizar" class="btn btn-warning">Actualizar</button>
            <button type="submit" name="accion" value="buscar" class="btn btn-info">Buscar</button>
            <a th:href="@{/gestionproductos(accion='listar')}" class="btn btn-secondary">Nuevo</a>
        </div>
    </form>

    <div class="table-responsive">
        <table class="table table-bordered table-hover text-center align-middle">
            <thead class="table-dark">
            <tr>
                <th>Codigo</th>
                <th>Descripcion</th>
                <th>Precio</th>
                <th>Laboratorio</th>
                <th>Lote</th>
                <th>Vencimiento</th>
                <th>Stock</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="p : ${listarProductos}">
                <td th:text="${p.codigoProductos}"></td>
                <td th:text="${p.descripcionProductos}"></td>
                <td th:text="${p.preciounitaria}"></td>
                <td th:text="${p.laboratorio}"></td>
                <td th:text="${p.lote}"></td>
                <td th:text="${p.fechaVencimiento}"></td>
                <td th:text="${p.stock}"></td>
                <td>
                    <a th:href="@{/gestionproductos(accion='buscar', Codigo=${p.codigoProductos})}" class="btn btn-sm btn-primary">Editar</a>
                    <a th:href="@{/gestionproductos(accion='eliminar', Codigo=${p.codigoProductos})}"
                       class="btn btn-sm btn-danger" onclick="return confirm('Eliminar producto?')">Eliminar</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="text-center mt-3">
        <a href="/ventas" class="btn btn-primary me-2"><i class="bi bi-cart3 me-1"></i>Ir a Ventas</a>
        <a href="/menu"   class="btn btn-outline-dark"><i class="bi bi-house me-1"></i>Volver al Menú</a>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
