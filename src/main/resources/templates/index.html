<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Panel de Gestión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <span class="navbar-brand">🏥 Farmacia Salud</span>
            <div class="text-white">
                Bienvenido, <span th:text="${session.usuario}"></span>
                (<span th:text="${session.rol}"></span>)
                <a href="/logout" class="btn btn-outline-danger btn-sm ms-3">Salir</a>
            </div>
        </div>
    </nav>
    <div class="container">
        <div class="row g-4">
            <div class="col-md-4">
                <div class="card p-4 text-center">
                    <h5>Realizar Ventas</h5>
                    <a href="/ventas" class="btn btn-primary mt-2">Acceder</a>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card p-4 text-center">
                    <h5>Gestionar Productos</h5>
                    <a href="/gestionproductos" class="btn btn-warning mt-2">Administrar</a>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card p-4 text-center">
                    <h5>Gestionar Clientes</h5>
                    <a href="/gestionclientes" class="btn btn-info mt-2">Administrar</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
